<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Formulário de Relatório | CLAI</title>

    <link rel="stylesheet" th:href="@{/css/relatorios-atendimento.css}" />
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
</head>

<body>
<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="container">

        <section class="page-header">
            <h1 th:text="${relatorio.id == null ? 'Novo Relatório de Atendimento' : 'Editar Relatório de Atendimento'}">
                Novo Relatório de Atendimento
            </h1>
            <p>Preencha as informações referentes ao atendimento realizado.</p>
        </section>

        <form
            class="relatorio-formulario"
            th:object="${relatorio}"
            th:action="${relatorio.id == null} ? @{/relatorios-atendimento/salvar} : @{/relatorios-atendimento/{id}/editar(id=${relatorio.id})}"
            method="post"
        >

            <input type="hidden" id="csrf-token"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <section class="relatorio-form-secao">
                <h2>Identificação</h2>

                <div th:if="${relatorio.id == null}" id="area-vinculo-aluno">

                    <div class="relatorio-form-campo">
                        <label>Aluno vinculado:</label>

                        <div class="opcoes-vinculo-aluno">
                            <label>
                                <input type="radio" name="tipoVinculoAluno"
                                       value="cadastrado" checked>
                                Aluno já cadastrado
                            </label>

                            <label>
                                <input type="radio" name="tipoVinculoAluno"
                                       value="novo">
                                Aluno não cadastrado
                            </label>
                        </div>
                    </div>

                    <div id="painel-aluno-cadastrado">
                        <div class="relatorio-form-campo campo-aluno">
                            <label for="busca-aluno-relatorio">Buscar aluno por nome ou matrícula *</label>

                            <input type="text"
                                   id="busca-aluno-relatorio"
                                   placeholder="Digite o nome ou a matrícula"
                                   autocomplete="off">

                            <div id="sugestoes-alunos-relatorio"
                                 class="sugestoes-alunos"></div>

                            <input type="hidden" th:field="*{alunoId}"
                                   id="aluno-id-relatorio">

                            <div id="aluno-selecionado-relatorio"
                                 class="dados-aluno-relatorio" hidden>
                                <strong id="aluno-nome-relatorio"></strong>
                                <span id="aluno-cpf-relatorio"></span>
                                <span id="aluno-matricula-relatorio"></span>
                                <span id="aluno-curso-relatorio"></span>
                                <span id="aluno-ingresso-relatorio"></span>
                                <span id="aluno-periodo-relatorio"></span>
                            </div>

                            <small class="relatorio-form-erro"
                                   th:if="${#fields.hasErrors('alunoId')}"
                                   th:errors="*{alunoId}"></small>
                        </div>
                    </div>

                    <div id="painel-aluno-novo" hidden>
                        <h3>Cadastro de novo aluno</h3>

                        <div class="relatorio-form-grade">
                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-nome">Nome completo *</label>
                                <input id="novo-aluno-nome" name="nome" type="text">
                            </div>

                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-cpf">CPF *</label>
                                <input id="novo-aluno-cpf" name="cpf"
                                       type="text" maxlength="11" inputmode="numeric">
                            </div>

                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-nascimento">Data de nascimento</label>
                                <input id="novo-aluno-nascimento"
                                       name="dataNascimento" type="date">
                            </div>

                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-telefone">Telefone do aluno *</label>
                                <input id="novo-aluno-telefone"
                                       name="contatoAluno.telefone" type="tel">
                            </div>

                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-email">E-mail do aluno</label>
                                <input id="novo-aluno-email"
                                       name="contatoAluno.email" type="email">
                            </div>

                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-matricula">Matrícula *</label>
                                <input id="novo-aluno-matricula"
                                       name="matricula.numeroMatricula" type="text">
                            </div>

                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-curso">Curso</label>
                                <input id="novo-aluno-curso"
                                       name="matricula.curso" type="text">
                            </div>

                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-ingresso">Período de ingresso *</label>
                                <input id="novo-aluno-ingresso"
                                       name="matricula.periodoIngresso" type="text">
                            </div>

                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-periodo">Período letivo *</label>
                                <input id="novo-aluno-periodo"
                                       name="matricula.periodoLetivo" type="text">
                            </div>

                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-responsavel">Nome do responsável *</label>
                                <input id="novo-aluno-responsavel"
                                       name="dadosResponsavel.nome" type="text">
                            </div>

                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-parentesco">Parentesco *</label>
                                <input id="novo-aluno-parentesco"
                                       name="dadosResponsavel.parentesco" type="text">
                            </div>

                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-telefone-responsavel">Telefone do responsável *</label>
                                <input id="novo-aluno-telefone-responsavel"
                                       name="dadosResponsavel.contatoDoResponsavel.telefone"
                                       type="tel">
                            </div>

                            <div class="relatorio-form-campo">
                                <label for="novo-aluno-email-responsavel">E-mail do responsável</label>
                                <input id="novo-aluno-email-responsavel"
                                       name="dadosResponsavel.contatoDoResponsavel.email"
                                       type="email">
                            </div>
                        </div>

                        <div id="erros-cadastro-aluno" class="relatorio-form-erro"
                             role="alert" aria-live="polite"></div>

                        <button type="button" id="salvar-aluno-integrado"
                                class="relatorios-btn-cadastrar">
                            Salvar aluno
                        </button>
                    </div>
                </div>

                <div class="relatorio-form-campo" th:unless="${relatorio.id == null}">
                    <label>Aluno vinculado</label>
                    <input type="text" th:value="${aluno.nome}" readonly />
                    <input type="hidden" th:field="*{alunoId}" />
                </div>

                <div class="relatorio-form-campo">
                    <label for="titulo">Título do relatório *</label>
                    <input
                        type="text"
                        id="titulo"
                        th:field="*{titulo}"
                        placeholder="Informe o título do relatório"
                        required
                    />
                    <small class="relatorio-form-erro"
                           th:if="${#fields.hasErrors('titulo')}"
                           th:errors="*{titulo}"></small>
                </div>
            </section>

            <section class="relatorio-form-secao">
                <h2>Dados do atendimento</h2>

                <div class="relatorio-form-grade">
                    <div class="relatorio-form-campo">
                        <label for="dataAtendimento">Data do atendimento *</label>
                        <input
                            type="date"
                            id="dataAtendimento"
                            th:field="*{dataAtendimento}"
                            required
                        />
                        <small class="relatorio-form-erro"
                               th:if="${#fields.hasErrors('dataAtendimento')}"
                               th:errors="*{dataAtendimento}"></small>
                    </div>

                    <div class="relatorio-form-campo">
                        <label for="profissionalResponsavel">Profissional responsável *</label>
                        <input
                            type="text"
                            id="profissionalResponsavel"
                            th:field="*{profissionalResponsavel}"
                            placeholder="Nome do profissional"
                            required
                        />
                        <small class="relatorio-form-erro"
                               th:if="${#fields.hasErrors('profissionalResponsavel')}"
                               th:errors="*{profissionalResponsavel}"></small>
                    </div>

                    <div class="relatorio-form-campo">
                        <label for="modalidade">Modalidade *</label>
                        <input
                            type="text"
                            id="modalidade"
                            th:field="*{modalidade}"
                            placeholder="Ex.: Presencial ou remoto"
                            required
                        />
                        <small class="relatorio-form-erro"
                               th:if="${#fields.hasErrors('modalidade')}"
                               th:errors="*{modalidade}"></small>
                    </div>

                    <div class="relatorio-form-campo">
                        <label for="tipoAtendimento">Tipo de atendimento *</label>
                        <input
                            type="text"
                            id="tipoAtendimento"
                            th:field="*{tipoAtendimento}"
                            placeholder="Ex.: Individual ou em grupo"
                            required
                        />
                        <small class="relatorio-form-erro"
                               th:if="${#fields.hasErrors('tipoAtendimento')}"
                               th:errors="*{tipoAtendimento}"></small>
                    </div>
                </div>
            </section>

            <section class="relatorio-form-secao">
                <h2>Descrição do atendimento</h2>

                <div class="relatorio-form-campo">
                    <label for="objetivo">Objetivo</label>
                    <textarea
                        id="objetivo"
                        th:field="*{objetivo}"
                        rows="3"
                        placeholder="Descreva o objetivo do atendimento"
                    ></textarea>
                </div>

                <div class="relatorio-form-campo">
                    <label for="atividadesRealizadas">Atividades realizadas *</label>
                    <textarea
                        id="atividadesRealizadas"
                        th:field="*{atividadesRealizadas}"
                        rows="5"
                        placeholder="Descreva as atividades realizadas durante o atendimento"
                        required
                    ></textarea>
                    <small class="relatorio-form-erro"
                           th:if="${#fields.hasErrors('atividadesRealizadas')}"
                           th:errors="*{atividadesRealizadas}"></small>
                </div>
            </section>

            <section class="relatorio-form-secao">
                <h2>Informações complementares</h2>

                <div class="relatorio-form-campo">
                    <label for="observacoes">Observações</label>
                    <textarea
                        id="observacoes"
                        th:field="*{observacoes}"
                        rows="3"
                        placeholder="Observações adicionais"
                    ></textarea>
                </div>

                <div class="relatorio-form-campo">
                    <label for="encaminhamentos">Encaminhamentos</label>
                    <textarea
                        id="encaminhamentos"
                        th:field="*{encaminhamentos}"
                        rows="3"
                        placeholder="Informe os encaminhamentos realizados"
                    ></textarea>
                </div>
            </section>

            <section class="relatorio-form-secao">
                <h2>Acompanhamento</h2>

                <div class="relatorio-form-grade">
                    <div class="relatorio-form-campo">
                        <label for="necessitaAcompanhamento">Necessita de acompanhamento? *</label>
                        <select
                            id="necessitaAcompanhamento"
                            th:field="*{necessitaAcompanhamento}"
                            required
                        >
                            <option value="">Selecione</option>
                            <option th:value="true">Sim</option>
                            <option th:value="false">Não</option>
                        </select>
                        <small class="relatorio-form-erro"
                               th:if="${#fields.hasErrors('necessitaAcompanhamento')}"
                               th:errors="*{necessitaAcompanhamento}"></small>
                    </div>

                    <div class="relatorio-form-campo">
                        <label for="dataProximoAcompanhamento">Data do próximo acompanhamento</label>
                        <input
                            type="date"
                            id="dataProximoAcompanhamento"
                            th:field="*{dataProximoAcompanhamento}"
                        />
                    </div>
                </div>
            </section>

            <div class="relatorio-form-acoes">
                <button type="submit" class="relatorios-btn-cadastrar">
                    Salvar relatório
                </button>

                <a
                    th:if="${relatorio.id == null}"
                    th:href="@{/relatorios-atendimento}"
                    class="relatorio-btn-voltar">
                    Cancelar
                </a>

                <a
                    th:unless="${relatorio.id == null}"
                    th:href="@{/relatorios-atendimento/{id}(id=${relatorio.id})}"
                    class="relatorio-btn-voltar">
                    Cancelar
                </a>
            </div>

        </form>

    </main>
</div>
<script th:inline="javascript">
    window.alunosDisponiveis = /*[[${alunos}]]*/ [];
</script>
<script th:src="@{/js/relatorios-atendimento.js}" defer></script>
</body>
</html>
