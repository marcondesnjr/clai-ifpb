<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${relatorio.id == null ? 'Cadastrar Relatório de Observação | CLAI' : 'Editar Relatório de Observação | CLAI'}">Relatório de Observação | CLAI</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/formulario_estudo_de_caso.css}">
</head>

<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="container">

        <header class="page-header">
            <div>
                <h1 th:text="${relatorio.id == null ? 'Cadastrar Relatório de Observação' : 'Editar Relatório de Observação'}">Relatório de Observação</h1>
                <p>Relato do assistente de aluno sobre o estudante.</p>
            </div>

            <a th:href="@{/relatorios-observacao}" class="btn-voltar">Voltar</a>
        </header>

        <!-- o id "formulario-estudo" reaproveita o estilo do formulário de estudo de caso -->
        <form id="formulario-estudo"
              th:object="${relatorio}"
              th:action="${relatorio.id == null}
                  ? @{/relatorios-observacao/salvar}
                  : @{/relatorios-observacao/{id}/editar(id=${relatorio.id})}"
              method="post">

            <section class="form-section" th:if="${#fields.hasErrors('*')}">
                <p class="mensagem-erro" th:each="erro : ${#fields.errors('*')}" th:text="${erro}"></p>
            </section>

            <section class="form-section">

                <div class="section-header">
                    <h2>1. Identificação</h2>
                </div>

                <div class="campo" th:if="${relatorio.id == null}">
                    <label for="aluno-id">Aluno *</label>

                    <select th:field="*{alunoId}" id="aluno-id">
                        <option value="">Selecione o aluno</option>
                        <option th:each="a : ${alunos}"
                                th:value="${a.id}"
                                th:text="${a.matricula != null ? a.nome + ' — ' + a.matricula.numeroMatricula : a.nome}">
                            Nome — 000000
                        </option>
                    </select>
                </div>

                <div class="campo" th:if="${relatorio.id != null}">
                    <label>Aluno vinculado</label>
                    <input type="text" th:value="${aluno != null ? aluno.nome : ''}" readonly>
                    <input type="hidden" th:field="*{alunoId}">
                </div>

                <div class="campo">
                    <label for="assistente">Assistente de aluno *</label>
                    <input type="text" id="assistente" th:field="*{assistente}" maxlength="255">
                </div>

                <div class="campo">
                    <label for="data-observacao">Data da observação *</label>
                    <input type="date" id="data-observacao" th:field="*{dataObservacao}">
                </div>

                <div class="campo">
                    <label for="contexto">Contexto da observação (sala de aula, intervalo, atividade...)</label>
                    <input type="text" id="contexto" th:field="*{contexto}" maxlength="255">
                </div>

            </section>

            <section class="form-section">

                <div class="section-header">
                    <h2>2. Observação</h2>
                </div>

                <div class="campo">
                    <label for="relato">Relato *</label>
                    <textarea id="relato" th:field="*{relato}" maxlength="5000"></textarea>
                </div>

                <div class="campo">
                    <label for="comportamentos">Comportamentos observados</label>
                    <textarea id="comportamentos" th:field="*{comportamentosObservados}" maxlength="5000"></textarea>
                </div>

                <div class="campo">
                    <label for="adicionais">Observações adicionais</label>
                    <textarea id="adicionais" th:field="*{observacoesAdicionais}" maxlength="5000"></textarea>
                </div>

            </section>

            <div class="form-actions">
                <a th:href="@{/relatorios-observacao}" class="btn-cancelar">Cancelar</a>

                <button type="submit" class="btn-salvar">Salvar relatório</button>
            </div>

        </form>

    </main>

</div>

</body>
</html>
