<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Redefinir senha — CLAI</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>

<body>
<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="container usuarios-pagina">

        <header class="usuarios-cabecalho">
            <div>
                <h1>Redefinir senha</h1>
                <p>Defina uma nova senha para o usuário.</p>
            </div>
        </header>

        <section class="usuarios-card">

            <form
                th:action="@{/usuarios/{id}/senha(id=${usuarioId})}"
                th:object="${form}"
                method="post"
                class="usuarios-formulario">

                <div class="mensagem-erro"
                     th:if="${#fields.hasGlobalErrors()}">

                    <p th:each="erro : ${#fields.globalErrors()}"
                       th:text="${erro}">
                    </p>
                </div>

                <div class="campo-usuario">
                    <label for="novaSenha">Nova senha</label>

                    <input
                        type="password"
                        id="novaSenha"
                        name="novaSenha"
                        placeholder="Mínimo de 8 caracteres"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                    <small th:if="${#fields.hasErrors('novaSenha')}"
                           th:errors="*{novaSenha}">
                    </small>
                </div>

                <div class="acoes-formulario">
                    <button type="submit" class="botao-novo">
                        Salvar nova senha
                    </button>

                    <a th:href="@{/usuarios}">
                        Cancelar
                    </a>
                </div>

            </form>
        </section>
    </main>

</div>
</body>
</html>
