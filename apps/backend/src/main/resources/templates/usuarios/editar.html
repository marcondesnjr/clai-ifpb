<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Editar usuário — CLAI</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>

<body>
<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="container usuarios-pagina">

        <header class="usuarios-cabecalho">
            <div>
                <h1>Editar usuário</h1>
                <p>Atualize os dados e o perfil de acesso.</p>
            </div>
        </header>

        <section class="usuarios-card">

            <form
                th:action="@{/usuarios/{id}/editar(id=${usuarioId})}"
                th:object="${form}"
                method="post"
                class="usuarios-formulario">

                <div class="mensagem-erro"
                     th:if="${#fields.hasGlobalErrors()}">

                    <p th:each="erro : ${#fields.globalErrors()}"
                       th:text="${erro}">
                    </p>
                </div>

                <div class="campo-usuario">
                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        th:field="*{nome}"
                        required>

                    <small th:if="${#fields.hasErrors('nome')}"
                           th:errors="*{nome}">
                    </small>
                </div>

                <div class="campo-usuario">
                    <label for="login">Login</label>

                    <input
                        type="text"
                        id="login"
                        th:field="*{login}"
                        required>

                    <small th:if="${#fields.hasErrors('login')}"
                           th:errors="*{login}">
                    </small>
                </div>

                <div class="campo-usuario">
                    <label for="perfil">Perfil de acesso</label>

                    <select
                        id="perfil"
                        th:field="*{perfil}"
                        required>

                        <option th:each="perfil : ${perfis}"
                                th:value="${perfil}"
                                th:text="${perfil}">
                        </option>
                    </select>

                    <small th:if="${#fields.hasErrors('perfil')}"
                           th:errors="*{perfil}">
                    </small>
                </div>

                <div class="acoes-formulario">
                    <button type="submit" class="botao-novo">
                        Salvar alterações
                    </button>

                    <a th:href="@{/usuarios}">
                        Cancelar
                    </a>
                </div>

            </form>

        </section>
    </main>

</div>
</body>
</html>
